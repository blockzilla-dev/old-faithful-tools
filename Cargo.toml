[workspace]
resolver = "2"
members = ["crates/old-faithful/of-car-reader", "crates/old-faithful/of-slot-ranges", "get-block", "examples/read-car"]
exclude = []

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/blockzilla-dev/old-faithful-tools"

[workspace.lints.rust]
unexpected_cfgs = "deny"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
